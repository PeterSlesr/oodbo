<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- parchment background, sharp corners -->
  <rect width="500" height="500" fill="#f5f2eb"/>
  <!-- oo: fills the square, first letter teal, second warm rose -->
  <text
    x="250" y="400"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="380"
    text-anchor="middle"
    letter-spacing="-12"
  ><tspan fill="#2a9ea0">o</tspan><tspan fill="#c44070">o</tspan></text>
</svg>
